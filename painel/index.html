<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel dos testes · MARES</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06182a">
<style>
@font-face{font-family:'Aileron';src:url('/fonts/Aileron-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Aileron';src:url('/fonts/Aileron-SemiBold.woff2') format('woff2');font-weight:500 600;font-style:normal;font-display:swap}
@font-face{font-family:'Aileron';src:url('/fonts/Aileron-Bold.woff2') format('woff2');font-weight:700 800;font-style:normal;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url('/fonts/Bricolage-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url('/fonts/Bricolage-Bold.woff2') format('woff2');font-weight:600 700;font-style:normal;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url('/fonts/Bricolage-ExtraBold.woff2') format('woff2');font-weight:800 900;font-style:normal;font-display:swap}

:root{
  /* Paleta categórica dos quatro perfis, validada para daltonismo e para
     contraste sobre fundo branco. Ordem fixa S, C, M, F. Não trocar por
     gosto: qualquer mudança precisa passar de novo pelo validador. */
  --S:#BE8C10; --C:#A34418; --M:#215F98; --F:#0E8F7E;
  --navy:#06182a; --azul:#1C6795; --turq:#15A5A8; --laranja:#E26220;
  --tinta:#132430; --tinta-2:#4a5b68; --tinta-3:#7b8a95;
  --linha:#e4e8ec; --fundo:#ffffff; --fundo-2:#f7f9fa;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --corpo:'Aileron',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--corpo);background:var(--fundo);color:var(--tinta);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}

header.topo{background:var(--navy);padding:20px 0;color:#FEEAD4}
.topo-in{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.topo img{height:30px;width:auto;display:block}
.topo span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(254,234,212,.65)}
.faixa{height:4px;background:linear-gradient(90deg,var(--laranja) 0%,var(--turq) 55%,var(--azul) 100%)}

.capa{padding:44px 0 10px}
.eyebrow{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:12px}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-size:clamp(1.9rem,4.6vw,2.9rem);margin-bottom:14px}
.sub{color:var(--tinta-2);font-size:16px;max-width:640px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:32px 0 8px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--linha);border-radius:14px;padding:18px 18px 16px;background:var(--fundo-2)}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.03em;line-height:1}
.tile small{display:block;font-size:12px;color:var(--tinta-3);margin-top:6px;line-height:1.4}

h2{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;margin:46px 0 6px;padding-top:26px;border-top:1px solid var(--linha)}
h2:first-of-type{border-top:0}
.nota{color:var(--tinta-2);font-size:14.5px;margin-bottom:20px;max-width:680px}

.legenda{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 18px}
.legenda i{display:inline-flex;align-items:center;gap:7px;font-style:normal;font-size:13px;color:var(--tinta-2)}
.legenda i s{width:12px;height:12px;border-radius:3px;display:block;text-decoration:none}

.barras{display:flex;flex-direction:column;gap:12px}

/* Vocabulário do time */
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:8px}
@media(max-width:760px){.vocab{grid-template-columns:1fr;gap:20px}}
.vocab h3{font-size:.95rem;margin:0 0 4px;color:var(--tinta)}
.vocab .cabecinho{font-size:13.5px;color:var(--tinta-2);margin:0 0 12px}
.palavras{list-style:none;padding:0;margin:0}
.palavras li{display:flex;align-items:baseline;gap:9px;padding:6px 0;border-bottom:1px solid var(--linha);font-size:14.5px}
.palavras li:last-child{border-bottom:0}
.palavras .ponto{width:9px;height:9px;border-radius:50%;flex:0 0 9px;transform:translateY(-1px)}
.palavras .txt{flex:1}
.palavras .qtd{color:var(--tinta-2);font-size:13px;white-space:nowrap}
.topos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
@media(max-width:860px){.topos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topos{grid-template-columns:1fr}}
.topo-perfil{border:1px solid var(--linha);border-radius:12px;padding:14px 15px}
.topo-perfil b{display:block;font-size:14px;margin-bottom:8px}
.topo-perfil ol{margin:0;padding-left:17px;font-size:13.5px;color:var(--tinta-2);line-height:1.55}
body.projecao .palavras li{font-size:19px;padding:9px 0}
body.projecao .topo-perfil ol{font-size:17px}
.linha{display:grid;grid-template-columns:190px 1fr 74px;align-items:center;gap:14px}
@media(max-width:640px){.linha{grid-template-columns:120px 1fr 60px;gap:10px}}
.rot{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.rot s{width:11px;height:11px;border-radius:3px;display:block;text-decoration:none;flex:0 0 11px}
.trilho{height:14px;background:var(--fundo-2);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.val{font-size:13px;color:var(--tinta-2);text-align:right;font-variant-numeric:tabular-nums}

.pilha{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--fundo-2)}
.pilha span{height:100%;box-shadow:inset -2px 0 0 var(--fundo);cursor:default}
.pilha span:last-child{box-shadow:none}
.grupo{display:grid;grid-template-columns:190px 1fr 74px;align-items:center;gap:14px;margin-bottom:10px}
@media(max-width:640px){.grupo{grid-template-columns:120px 1fr 60px;gap:10px}}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linha)}
th{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.cel{text-align:center;font-variant-numeric:tabular-nums;border-radius:4px}

.leitura{border:1px solid var(--linha);border-radius:14px;padding:22px 22px 6px;background:var(--fundo-2);margin-top:8px}
.leitura p{margin-bottom:16px;font-size:15px;line-height:1.7;color:var(--tinta)}
.leitura p b{font-family:var(--display);font-weight:700}

.escopo{margin:44px 0 0;border-top:1px solid var(--linha);padding-top:20px;font-size:12.5px;color:var(--tinta-3);line-height:1.65}
footer{padding:26px 0 46px;font-size:12.5px;color:var(--tinta-3)}
.aviso{border:1px solid #f0c9a8;background:#fdf4ec;border-radius:14px;padding:22px;margin:36px 0;font-size:15px;color:#7a4318}
.carregando{padding:60px 0;text-align:center;color:var(--tinta-3)}
details{margin-top:14px}
summary{cursor:pointer;font-size:13.5px;color:var(--azul)}
@media print{
  header.topo{background:#fff;color:#132430}
  .tile,.leitura{background:#fff}
  body{font-size:12px}
}

/* ============ MODO PROJEÇÃO ============
   Para deixar na tela grande durante a palestra. Letra maior, menos texto
   de apoio e um selo mostrando que a tela se atualiza sozinha. */
body.projecao{font-size:20px}
body.projecao .wrap{max-width:1500px}
body.projecao h1{font-size:clamp(2.6rem,5vw,4rem)}
body.projecao h2{font-size:1.9rem;margin-top:52px}
body.projecao .tile b{font-size:3.4rem}
body.projecao .tile small{font-size:16px}
body.projecao .rot{font-size:20px}
body.projecao .val{font-size:19px}
body.projecao .trilho{height:22px}
body.projecao .pilha{height:38px}
body.projecao .leitura p{font-size:21px}
body.projecao .nota{font-size:18px}
body.projecao details,body.projecao .escopo,body.projecao footer{display:none}
.aovivo{display:none;align-items:center;gap:9px;font-size:13px;color:var(--tinta-3)}
body.projecao .aovivo{display:inline-flex;font-size:17px}
.aovivo b{width:10px;height:10px;border-radius:50%;background:#0E8F7E;animation:pulso 2s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.3}50%{opacity:1}}

/* ============ LISTA DE TURMAS ============ */
.turmas{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.turma{
  display:grid;grid-template-columns:1fr 130px 150px 210px;align-items:center;gap:14px;
  border:1px solid var(--linha);border-radius:12px;padding:14px 18px;background:var(--fundo-2);
}
@media(max-width:820px){.turma{grid-template-columns:1fr;gap:6px}}
.turma-cod{font-family:var(--display);font-weight:700;font-size:15px;word-break:break-all}
.turma-cod small{display:block;font-family:var(--corpo);font-weight:400;font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.turma-num{font-family:var(--display);font-weight:700;font-size:15px}
.turma-data{font-size:13px;color:var(--tinta-3)}
.turma a{display:inline-block;font-size:13.5px;color:#fff;background:var(--azul);border-radius:100px;padding:8px 16px;text-decoration:none}
.turma a:hover{background:var(--navy)}
.turma a.vivo{background:var(--laranja);margin-left:8px}

/* Reunir turmas num painel só */
.turma-cod .marca{display:inline-flex;align-items:center;vertical-align:middle;margin-right:9px;cursor:pointer}
.turma-cod .marca input{position:absolute;opacity:0;width:0;height:0}
.turma-cod .marca span{width:18px;height:18px;border:1.5px solid #b9c9d6;border-radius:5px;display:block;background:#fff;transition:.15s}
.turma-cod .marca input:checked + span{background:var(--azul);border-color:var(--azul);
  box-shadow:inset 0 0 0 3px #fff}
.turma-cod .marca input:focus-visible + span{outline:2px solid var(--laranja);outline-offset:2px}
.turma-cod .marca input:disabled + span{background:#eef2f5;border-color:#dde5ea;cursor:not-allowed}
.turma.fora{opacity:.42}

/* Atalhos para as planilhas */
.planilhas{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media(max-width:860px){.planilhas{grid-template-columns:1fr}}
.pl{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  border:1px solid var(--linha);border-radius:12px;padding:16px 18px;background:var(--fundo-2)}
.pl b{font-family:var(--display);font-size:15px;display:block;margin-bottom:5px}
.pl small{display:block;font-size:13.5px;color:var(--tinta-2);line-height:1.55}
.pl .abas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
.pl .abas i{font-style:normal;font-size:11.5px;color:var(--tinta-2);background:#eef2f5;
  border-radius:4px;padding:2px 7px}
.pl .abas em{font-style:normal;font-size:11.5px;color:var(--tinta-3)}
.pl a{flex:0 0 auto;font-size:13.5px;color:#fff;background:var(--azul);border-radius:100px;
  padding:8px 16px;text-decoration:none;white-space:nowrap}
.pl a:hover{background:var(--navy)}
.atalho-pl{margin-top:26px;font-size:14px;color:var(--tinta-2)}
.atalho-pl a{color:var(--azul)}
/* O display:flex abaixo venceria o atributo hidden, então a regra vem antes. */
.junta[hidden]{display:none}
.junta{position:sticky;bottom:14px;z-index:5;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-top:16px;padding:14px 18px;border-radius:12px;
  background:var(--navy);color:#fff;box-shadow:0 12px 30px rgba(6,24,42,.25)}
.junta b{font-family:var(--display);font-size:15px;display:block}
.junta small{display:block;font-size:12.5px;color:#b9c9d6;margin-top:2px;word-break:break-all}
.junta-acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.junta a{display:inline-block;font-size:13.5px;color:#fff;background:var(--azul);border-radius:100px;
  padding:8px 16px;text-decoration:none}
.junta a.vivo{background:var(--laranja)}
.junta button{font:inherit;font-size:13.5px;color:#b9c9d6;background:none;border:0;cursor:pointer;
  text-decoration:underline;padding:8px 4px}
</style>
</head>
<body>

<header class="topo">
  <div class="wrap topo-in">
    <a href="/"><img src="/assets/logo-mares.png" alt="MARES Consultoria Empresarial"></a>
    <span id="rotulo-topo">Painel dos testes MARES</span>
    <span class="aovivo"><b></b> atualiza sozinho a cada 30 segundos</span>
  </div>
</header>
<div class="faixa"></div>

<main class="wrap" id="conteudo">
  <div class="carregando" id="carregando">Carregando os dados do time…</div>
</main>

<footer class="wrap">
  © <span id="ano"></span> MARES Consultoria Empresarial · Pessoas, Dados e Gestão
</footer>

<script>
/* =======================================================================
   PAINEL DE TEMPERAMENTOS DO TIME
   Lê os dados de uma turma pelo Apps Script e monta a leitura coletiva.
   Endereço: /painel/?time=codigo&chave=CHAVE

   Regra que este painel nunca quebra: ele fala do conjunto. Nome, e-mail,
   telefone e cargo não saem da planilha, e não existe nenhuma tela que
   mostre o resultado individual de uma pessoa para a empresa.
   ======================================================================= */

const WEBHOOK = 'https://script.google.com/macros/s/AKfycbx4UBHQ5yh13Tx3IEX8SN4xEHMCZtYoSz_Vm53f2P7v44nQidwErRvq_uximUQdmU58/exec';

/* ================== AS PLANILHAS ==================
   Atalho para as bases, para não precisar caçar no Drive. Só aparece para quem
   já tem a chave do painel, e abrir o link não basta: o Google ainda vai pedir
   login e conferir a permissão de cada planilha.
   Planilha nova entra aqui, e a `chave` é o que liga cada painel à sua base. */
const PLANILHAS = [
  {
    chave: 'central',
    nome: 'MARES · Central de Dados do Site',
    id: '1tQzT-SC3QsxvJlAHXvQyz5OONGmlX8Q5IjrRloSHc9s',
    conta: 'atendimento@mareslideranca.com.br',
    o_que: 'A base central de tudo o que o site coleta. Respostas do Teste dos Temperamentos, a aba Eventos que alimenta todos os painéis, a Legenda das 200 características, as inscrições da Imersão, as respostas da Bússola de IA, os mapas de indicadores e as inscrições da Imersão Mares.IA.',
    abas: ['Respostas', 'Eventos', 'Legenda', 'Imersao', 'Bussola', 'Mapa', 'MaresIA']
  },
  {
    chave: 'resultados',
    nome: 'MARES Resultados',
    id: '1Zj0XEtRNaOOZYhOoCu8jTjMEdaOpBR1TpMZ8gEpG6Hk',
    conta: 'atendimento@mareslideranca.com.br',
    o_que: 'Respostas completas do RaioX e da Sonda, com nome, e-mail e telefone de quem respondeu. É daqui que saem os e-mails dos dois diagnósticos.',
    abas: ['RaioX', 'Sonda']
  },
  {
    chave: 'cadastros',
    nome: 'MARES · Cadastros do Site',
    id: '1LhMrNfIPPL24h5nAo18uI64SmpZDCb5bTBl_KTgXVSI',
    conta: 'marcelis@mareslideranca.com.br',
    o_que: 'Quem preencheu os formulários de Contato e do Diagnóstico. A inscrição da Imersão saía errada aqui até 9 de agosto e hoje vai para a base central.',
    abas: ['Cadastros']
  },
  {
    chave: 'forms-antigo',
    nome: 'Teste dos Temperamentos · Google Forms',
    id: '11T9u9o3-h-8IB8nUBBG2rE67ofyif0k-FXsJmKeqCB4',
    conta: 'marcelis@mareslideranca.com.br',
    o_que: 'Histórico do formulário antigo, de antes do teste viver dentro do site. Não recebe resposta nova, serve para consulta.',
    abas: ['Respostas do formulário']
  }
];
const planilhaUrl = c => {
  const p = PLANILHAS.find(x => x.chave === c);
  return p ? 'https://docs.google.com/spreadsheets/d/' + p.id + '/edit' : '';
};

const ORDEM = ['S','C','M','F'];
const PERFIS = {
  S:{animal:'Golfinho', nome:'Sanguíneo',  cor:'var(--S)', hex:'#BE8C10'},
  C:{animal:'Tubarão',  nome:'Colérico',   cor:'var(--C)', hex:'#A34418'},
  M:{animal:'Polvo',    nome:'Melancólico',cor:'var(--M)', hex:'#215F98'},
  F:{animal:'Tartaruga',nome:'Fleumático', cor:'var(--F)', hex:'#0E8F7E'}
};
const PORANIMAL = {};
Object.keys(PERFIS).forEach(k => { PORANIMAL[PERFIS[k].animal] = k; });
const NATURAIS = ['CM','MC','SF','FS'];
const OPOSTAS  = ['CF','FC','MS','SM'];

const FORTE = {
  S:'comunicação, mobilização e relação',
  C:'decisão, ritmo e execução',
  M:'análise, critério e qualidade',
  F:'estabilidade, escuta e continuidade'
};
const FALTA = {
  S:'a energia de mobilizar e comunicar por dentro',
  C:'alguém que puxe a decisão quando ninguém quer decidir',
  M:'o olhar crítico que enxerga o risco antes dele acontecer',
  F:'a calma que sustenta o time quando o ambiente esquenta'
};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (n, t) => t ? Math.round(n / t * 1000) / 10 : 0;

document.getElementById('ano').textContent = new Date().getFullYear();

/* ======================= BUSCA ======================= */
const params = new URLSearchParams(location.search);
/* Mesma limpeza que o teste aplica no código do time, para o link do painel
   achar a turma mesmo quando alguém escreve com maiúscula, acento, espaço
   ou sublinhado. Sem isso, o painel procuraria um código que não existe. */
/* Aceita um código só ou vários separados por vírgula, para reunir turmas
   diferentes num painel único. A limpeza é a mesma do teste e do Apps Script,
   aplicada em cada código separadamente. */
const TIMES = (params.get('time') || '').split(/[,+]/)
  .map(c => c.trim().toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40))
  .filter((c,i,a) => c && a.indexOf(c) === i);
const TIME = TIMES.join(',');
const CHAVE = params.get('chave') || '';

/* O caminho principal é o fetch normal, que não manda cookie para o Google e
   por isso funciona mesmo quando a pessoa está logada em mais de uma conta.
   O JSONP fica como plano B, para o caso de o fetch ser bloqueado. */
function jsonp(url){
  return new Promise((ok, falha) => {
    const nome = 'mares_cb_' + Math.random().toString(36).slice(2,9);
    const s = document.createElement('script');
    const limpar = () => { delete window[nome]; s.remove(); };
    window[nome] = d => { limpar(); ok(d); };
    s.onerror = () => { limpar(); falha(new Error('falha ao buscar os dados')); };
    s.src = url + '&callback=' + nome;
    document.body.appendChild(s);
    setTimeout(() => { if (window[nome]) { limpar(); falha(new Error('a resposta demorou demais')); } }, 25000);
  });
}
async function buscar(url){
  try {
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) throw new Error('resposta ' + r.status);
    return await r.json();
  } catch (e) {
    return jsonp(url);
  }
}

const TESTE = (params.get('teste') || '').trim();
const PROJECAO = params.get('projecao') === '1' || params.get('ao-vivo') === '1';
/* Respondentes gerais: quem chegou pelo site por conta própria, fora de
   qualquer turma. É o termômetro de quem procura a MARES sozinho. */
const GERAL = params.get('geral') === '1';
const SEGUNDOS = 30;

/* Um endereço só serve a tudo:
   sem código de turma          lista tudo o que já foi usado
   com código e sem teste       Teste dos Temperamentos daquela turma
   com código e com teste       RaioX ou Sonda daquela turma          */
async function iniciar(){
  if (!CHAVE) return erro('Este endereço está incompleto. O link do painel precisa da chave de acesso.');
  if (PROJECAO) document.body.classList.add('projecao');
  try {
    if (!TIME && !GERAL) return await centralDeTurmas();
    if (TESTE && TESTE !== 'Temperamentos') return await painelDeDimensoes();
    const d = await buscar(WEBHOOK + (GERAL ? '?geral=1' : '?time=' + encodeURIComponent(TIME)) + '&chave=' + encodeURIComponent(CHAVE));
    if (d.erro) return erroChave(d.erro);
    if (!d.total) return vazio();
    montar(d);
    agendar();
  } catch (e) {
    erro('Não consegui buscar os dados agora. ' + esc(e.message) + '.');
  }
}
function erroChave(e){
  return erro(e === 'chave invalida'
    ? 'A chave de acesso deste link não confere. Peça o link atualizado para a equipe da MARES.'
    : 'Não foi possível montar o painel: ' + esc(e));
}
function vazio(){
  erro('Ainda não há nenhuma resposta registrada para <b>' + (GERAL ? 'os respondentes gerais' : esc(TIME)) + '</b>. Assim que as pessoas responderem, o painel aparece aqui sozinho.'
    + (PROJECAO ? ' Esta tela se atualiza sozinha a cada ' + SEGUNDOS + ' segundos.' : ''));
  agendar();
}
/* No modo projeção a tela se atualiza sozinha, para a sala se ver
   se formando enquanto responde. */
function agendar(){
  if (!PROJECAO) return;
  clearTimeout(window.__t);
  window.__t = setTimeout(() => iniciar(), SEGUNDOS * 1000);
}
function erro(msg){
  $('#conteudo').innerHTML = '<div class="aviso">' + msg + '</div>';
}

/* ======================= AGRUPAMENTOS ======================= */
function contarPor(linhas, campo){
  const m = new Map();
  linhas.forEach(l => {
    const v = String(l[campo] || '').trim() || 'Não informado';
    m.set(v, (m.get(v) || 0) + 1);
  });
  return [...m.entries()].sort((a,b) => b[1] - a[1]);
}
function perfilDe(l, qual){
  const animal = String(l[qual === 'sec' ? 'secundario_animal' : 'predominante_animal'] || '').trim();
  if (PORANIMAL[animal]) return PORANIMAL[animal];
  const nome = String(l[qual === 'sec' ? 'secundario' : 'predominante'] || '').trim();
  const achado = Object.keys(PERFIS).find(k => PERFIS[k].nome === nome);
  return achado || null;
}
function distribuicao(linhas, qual){
  const c = {S:0,C:0,M:0,F:0};
  linhas.forEach(l => { const k = perfilDe(l, qual); if (k) c[k]++; });
  return c;
}
function cruzar(linhas, campo, qual){
  const grupos = new Map();
  linhas.forEach(l => {
    const g = String(l[campo] || '').trim() || 'Não informado';
    if (!grupos.has(g)) grupos.set(g, {S:0,C:0,M:0,F:0,total:0});
    const k = perfilDe(l, qual);
    if (k) { grupos.get(g)[k]++; grupos.get(g).total++; }
  });
  return [...grupos.entries()].filter(([,v]) => v.total).sort((a,b) => b[1].total - a[1].total);
}

/* ======================= DESENHO ======================= */
function legenda(){
  return '<div class="legenda">' + ORDEM.map(k =>
    '<i><s style="background:' + PERFIS[k].cor + '"></s>' + PERFIS[k].animal + ' · ' + PERFIS[k].nome + '</i>').join('') + '</div>';
}
function barras(cont, total){
  const maior = Math.max.apply(null, ORDEM.map(k => cont[k])) || 1;
  return '<div class="barras">' + ORDEM.slice().sort((a,b) => cont[b] - cont[a]).map(k =>
    '<div class="linha"><div class="rot"><s style="background:' + PERFIS[k].cor + '"></s>' + PERFIS[k].animal + '</div>' +
    '<div class="trilho"><div class="fill" style="width:' + (cont[k]/maior*100) + '%;background:' + PERFIS[k].cor + '" title="' + PERFIS[k].animal + ': ' + cont[k] + ' de ' + total + '"></div></div>' +
    '<div class="val">' + cont[k] + ' · ' + pct(cont[k], total) + '%</div></div>').join('') + '</div>';
}
function pilhas(grupos){
  return grupos.map(([nome, v]) =>
    '<div class="grupo"><div class="rot" style="font-weight:600">' + esc(nome) + '</div>' +
    '<div class="pilha">' + ORDEM.filter(k => v[k]).map(k =>
      '<span style="width:' + (v[k]/v.total*100) + '%;background:' + PERFIS[k].cor + '" title="' + PERFIS[k].animal + ': ' + v[k] + ' de ' + v.total + '"></span>').join('') +
    '</div><div class="val">' + v.total + '</div></div>').join('');
}
function tabelaCruzada(grupos, titulo){
  return '<details><summary>Ver os números em tabela</summary><table><thead><tr><th>' + titulo + '</th>' +
    ORDEM.map(k => '<th class="num">' + PERFIS[k].animal + '</th>').join('') + '<th class="num">Total</th></tr></thead><tbody>' +
    grupos.map(([nome, v]) => '<tr><td>' + esc(nome) + '</td>' +
      ORDEM.map(k => '<td class="num">' + v[k] + '</td>').join('') + '<td class="num">' + v.total + '</td></tr>').join('') +
    '</tbody></table></details>';
}
function matriz(linhas){
  const m = {}; let maior = 0;
  ORDEM.forEach(a => { m[a] = {}; ORDEM.forEach(b => m[a][b] = 0); });
  linhas.forEach(l => {
    const p = perfilDe(l,'pred'), s = perfilDe(l,'sec');
    if (p && s) { m[p][s]++; if (m[p][s] > maior) maior = m[p][s]; }
  });
  const cel = n => {
    if (!n) return 'background:var(--fundo-2);color:var(--tinta-3)';
    const t = n / (maior || 1);
    return 'background:rgba(33,95,152,' + (0.10 + t * 0.75).toFixed(2) + ');color:' + (t > 0.55 ? '#fff' : 'var(--tinta)');
  };
  return '<table><thead><tr><th>Predominante ↓ · Secundário →</th>' +
    ORDEM.map(k => '<th class="num">' + PERFIS[k].animal + '</th>').join('') + '</tr></thead><tbody>' +
    ORDEM.map(a => '<tr><td><b>' + PERFIS[a].animal + '</b></td>' +
      ORDEM.map(b => a === b ? '<td class="cel" style="background:var(--fundo-2);color:var(--tinta-3)">—</td>'
        : '<td class="cel" style="' + cel(m[a][b]) + '">' + (m[a][b] || '') + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

/* ======================= LEITURA DO TIME =======================
   Regras simples e declaradas. Nada aqui é diagnóstico. O texto descreve
   o que a contagem mostra e o que costuma acontecer com essa composição. */
function leitura(linhas, pred, total){
  const ord = ORDEM.slice().sort((a,b) => pred[b] - pred[a]);
  const topo = ord[0], base = ord[3];
  const p = [];

  p.push('<p>Foram <b>' + total + ' respostas</b> neste time. O perfil mais presente como predominante é o <b>' +
    PERFIS[topo].animal + '</b>, com ' + pred[topo] + ' pessoas, ' + pct(pred[topo], total) + '% do grupo. ' +
    'Na prática, é a marca de ' + FORTE[topo] + ' que tende a aparecer primeiro na forma como este time trabalha.</p>');

  if (pct(pred[topo], total) >= 50) {
    p.push('<p>Mais da metade do time tem o mesmo perfil predominante. Times assim costumam ser rápidos para se entender, ' +
      'porque falam a mesma língua, e lentos para enxergar o que está fora do próprio jeito de olhar. ' +
      'Vale trazer de propósito, nas decisões importantes, a leitura de quem tem perfil diferente.</p>');
  }

  if (!pred[base]) {
    p.push('<p>Nenhuma pessoa deste time tem o <b>' + PERFIS[base].animal + '</b> como perfil predominante. ' +
      'Isso significa que falta naturalmente ' + FALTA[base] + '. Não é um defeito do time, é um ponto cego: ' +
      'esse papel precisa ser combinado com alguém, e não esperado de alguém.</p>');
  } else if (pct(pred[base], total) <= 10) {
    p.push('<p>O <b>' + PERFIS[base].animal + '</b> aparece pouco, em ' + pred[base] + ' pessoa' + (pred[base] > 1 ? 's' : '') +
      '. É a voz mais rara da sala, justamente a que traz ' + FALTA[base] + '. Vale garantir que ela seja ouvida, ' +
      'porque em grupo a minoria tende a se calar.</p>');
  }

  const chaves = linhas.map(l => { const a = perfilDe(l,'pred'), b = perfilDe(l,'sec'); return a && b ? a+b : null; }).filter(Boolean);
  const nat = chaves.filter(c => NATURAIS.indexOf(c) >= 0).length;
  const opo = chaves.filter(c => OPOSTAS.indexOf(c) >= 0).length;
  if (chaves.length) {
    const comp = chaves.length - nat - opo;
    let t = '<p>Olhando a combinação entre predominante e secundário, ' + nat +
      (nat === 1 ? ' pessoa do time tem' : ' pessoas do time têm') + ' uma combinação natural, ' +
      opo + (opo === 1 ? ' tem' : ' têm') + ' uma combinação oposta e ' +
      comp + (comp === 1 ? ' tem' : ' têm') + ' uma combinação complementar. ';
    t += opo
      ? 'Quem carrega perfis opostos costuma alternar de postura conforme o contexto, e é bom saber disso antes de interpretar como incoerência o que é adaptação.</p>'
      : 'Ninguém aqui carrega perfis opostos, o que costuma significar um time com menos tensão interna de estilo e, em compensação, menos variedade de olhar sobre o mesmo problema.</p>';
    p.push(t);
  }

  const lideres = linhas.filter(l => String(l.lidera || '').indexOf('Lidero') === 0);
  if (lideres.length >= 3) {
    const pl = distribuicao(lideres, 'pred');
    const topoL = ORDEM.slice().sort((a,b) => pl[b] - pl[a])[0];
    if (topoL !== topo) {
      p.push('<p>Na camada de liderança, com ' + lideres.length + ' pessoas, o perfil mais presente é o <b>' +
        PERFIS[topoL].animal + '</b>, diferente do time como um todo. Essa diferença costuma explicar ruído de ritmo: ' +
        'a liderança pede uma coisa no tempo dela e a equipe responde no tempo do perfil dela.</p>');
    } else {
      p.push('<p>Na camada de liderança, com ' + lideres.length + ' pessoas, o perfil mais presente é o mesmo do time como um todo, ' +
        'o <b>' + PERFIS[topoL].animal + '</b>. Isso dá coesão e, ao mesmo tempo, aumenta o ponto cego, porque quem decide ' +
        'enxerga pela mesma lente de quem executa.</p>');
    }
  }

  return '<div class="leitura">' + p.join('') + '</div>';
}

/* Barra de reunir turmas. Aparece na primeira marcação e monta o link sozinha. */
function ligarJuncao(){
  const caixas = [...document.querySelectorAll('.jun')];
  if (!caixas.length) return;
  const barra = document.getElementById('junta');
  const conta = document.getElementById('junta-n');
  const lista = document.getElementById('junta-lista');
  const abrir = document.getElementById('junta-abrir');
  const vivo  = document.getElementById('junta-vivo');

  function atualizar(){
    const marcadas = caixas.filter(c => c.checked);
    const sel = marcadas.map(c => c.value);
    const teste = marcadas.length ? marcadas[0].dataset.teste : '';

    /* Turma de outro teste sai de cena enquanto houver alguma marcada, para não
       existir a possibilidade de montar um link que mistura RaioX com
       Temperamentos e devolve um painel sem sentido. */
    caixas.forEach(c => {
      const bloquear = marcadas.length > 0 && c.dataset.teste !== teste;
      c.disabled = bloquear;
      c.closest('.turma').classList.toggle('fora', bloquear);
    });

    barra.hidden = sel.length === 0;
    if (!sel.length) return;
    conta.textContent = (sel.length === 1 ? '1 turma marcada' : sel.length + ' turmas marcadas') +
      (teste ? ' · ' + teste : '');
    lista.textContent = sel.length === 1
      ? 'Marque mais uma do mesmo teste para reunir. Com uma só, o painel é o normal daquela turma.'
      : sel.join(' + ');
    const doTeste = (teste && teste !== 'Temperamentos') ? '&teste=' + encodeURIComponent(teste) : '';
    const url = '/painel/?time=' + sel.map(encodeURIComponent).join(',') + doTeste +
      '&chave=' + encodeURIComponent(CHAVE);
    abrir.href = url;
    vivo.href = url + '&projecao=1';
  }
  caixas.forEach(c => c.addEventListener('change', atualizar));
  document.getElementById('junta-limpa').addEventListener('click', () => {
    caixas.forEach(c => { c.checked = false; }); atualizar();
  });
  atualizar();
}

/* ======================= PAINEL DO RAIOX E DA SONDA =======================
   Os dois medem nota por dimensão, então o mesmo painel serve para ambos.
   A cor aqui não identifica série, ela mede grandeza: uma cor só, e a
   dimensão mais frágil destacada com rótulo, nunca por cor sozinha.     */
async function painelDeDimensoes(){
  const d = await buscar(WEBHOOK + (GERAL ? '?geral=1' : '?modo=evento&time=' + encodeURIComponent(TIME)) +
    '&teste=' + encodeURIComponent(TESTE) + '&chave=' + encodeURIComponent(CHAVE));
  if (d.erro) return erroChave(d.erro);
  if (!d.total) return vazio();
  document.title = 'Painel do ' + TESTE + ' · MARES';

  const linhas = d.linhas;
  const soma = {}, cont = {}, nomes = {};
  linhas.forEach(l => {
    let dim = l.dimensoes;
    if (typeof dim === 'string') { try { dim = JSON.parse(dim); } catch (e) { dim = []; } }
    (dim || []).forEach(x => {
      const k = x.chave || x.nome;
      if (!k) return;
      nomes[k] = x.nome || k;
      soma[k] = (soma[k] || 0) + Number(x.nota || 0);
      cont[k] = (cont[k] || 0) + 1;
    });
  });
  const dims = Object.keys(soma).map(k => ({chave:k, nome:nomes[k], media: soma[k]/cont[k]}));
  dims.sort((a,b) => b.media - a.media);

  const medias = linhas.map(l => Number(l.media)).filter(n => !isNaN(n) && n > 0);
  const geral = medias.length ? medias.reduce((a,b) => a+b, 0) / medias.length : 0;
  const escala = Number((linhas.find(l => l.escala) || {}).escala) || 5;
  const niveis = contarPor(linhas.filter(l => l.nivel), 'nivel');
  const fraca = dims[dims.length-1], forte = dims[0];
  const um = n => n.toFixed(1).replace('.', ',');

  const reunidas = (d.times || TIMES);
  const varias = reunidas.length > 1;

  const h = [];
  h.push('<div class="capa"><p class="eyebrow">Metodologia MARES · ' + esc(TESTE) + '</p>' +
    '<h1>' + esc(TESTE) + '<br>' + (GERAL ? 'Respondentes gerais' : (varias ? reunidas.length + ' turmas reunidas' : esc(TIME))) + '</h1>' +
    '<p class="sub">' + (GERAL ? 'Todo mundo que respondeu pelo site por conta própria, fora de qualquer turma. ' : '') + 'Retrato do grupo que respondeu. Cada barra é a média da sala naquela dimensão, ' +
    'numa escala de 1 a ' + escala + '. Nenhum resultado individual aparece aqui.' +
    (varias ? ' Este painel soma as turmas ' + reunidas.map(c => '<b>' + esc(c) + '</b>').join(', ') + '.' : '') +
    '</p></div>');

  h.push('<div class="tiles">' +
    '<div class="tile"><b>' + d.total + '</b><small>pessoas responderam</small></div>' +
    '<div class="tile"><b>' + um(geral) + '</b><small>média geral da sala, de 1 a ' + escala + '</small></div>' +
    (fraca ? '<div class="tile"><b style="color:var(--laranja);font-size:1.4rem">' + esc(fraca.nome) + '</b><small>dimensão mais frágil do grupo</small></div>' : '') +
    (forte ? '<div class="tile"><b style="color:var(--F);font-size:1.4rem">' + esc(forte.nome) + '</b><small>dimensão mais forte do grupo</small></div>' : '') +
    '</div>');

  if (dims.length) {
    h.push('<h2>Média da sala em cada dimensão</h2>' +
      '<p class="nota">Da mais forte para a mais frágil. A barra em laranja é a que o grupo precisa olhar primeiro.</p>' +
      '<div class="barras">' + dims.map((x,i) => {
        const ultima = i === dims.length-1;
        return '<div class="linha"><div class="rot">' + esc(x.nome) + (ultima ? ' <small style="color:var(--laranja);font-weight:400">mais frágil</small>' : '') + '</div>' +
          '<div class="trilho"><div class="fill" style="width:' + (x.media/escala*100) + '%;background:' + (ultima ? 'var(--laranja)' : 'var(--azul)') + '" title="' + esc(x.nome) + ': ' + um(x.media) + '"></div></div>' +
          '<div class="val">' + um(x.media) + '</div></div>';
      }).join('') + '</div>');
  }

  /* Só quando o painel reúne turmas: a média de cada uma, para comparar. */
  if (varias) {
    const porTurma = new Map();
    linhas.forEach(l => {
      const t = String(l.time || '').trim() || 'sem código';
      const n = Number(l.media);
      if (isNaN(n) || !n) return;
      if (!porTurma.has(t)) porTurma.set(t, {soma:0, qtd:0});
      const o = porTurma.get(t); o.soma += n; o.qtd++;
    });
    const lista = [...porTurma.entries()].map(([t,o]) => ({t, media:o.soma/o.qtd, qtd:o.qtd}))
      .sort((a,b) => b.media - a.media);
    if (lista.length > 1) {
      h.push('<h2>Cada turma dentro do conjunto</h2>' +
        '<p class="nota">A média de cada turma reunida, da maior para a menor, com quantas pessoas responderam em cada uma. ' +
        'Serve para ver se o conjunto é parelho ou se uma turma está puxando a média.</p>' +
        '<div class="barras">' + lista.map(x =>
          '<div class="linha"><div class="rot">' + esc(x.t) + ' <small style="font-weight:400;color:var(--tinta-3)">' + x.qtd + ' resposta' + (x.qtd === 1 ? '' : 's') + '</small></div>' +
          '<div class="trilho"><div class="fill" style="width:' + (x.media/escala*100) + '%;background:var(--azul)"></div></div>' +
          '<div class="val">' + um(x.media) + '</div></div>').join('') + '</div>');
    }
  }

  if (niveis.length) {
    const maior = niveis[0][1];
    h.push('<h2>Como a sala se distribui por nível</h2>' +
      '<p class="nota">Quantas pessoas caíram em cada nível de resultado do teste.</p>' +
      '<div class="barras">' + niveis.map(([nome, n]) =>
        '<div class="linha"><div class="rot">' + esc(nome) + '</div>' +
        '<div class="trilho"><div class="fill" style="width:' + (n/maior*100) + '%;background:var(--azul)"></div></div>' +
        '<div class="val">' + n + '</div></div>').join('') + '</div>');
  }

  const p = [];
  p.push('<p>Responderam <b>' + d.total + ' pessoas</b>. A média geral da sala é <b>' + um(geral) + '</b> numa escala de 1 a ' + escala + '.</p>');
  if (fraca && forte && dims.length > 1) {
    p.push('<p>A dimensão mais frágil do grupo é <b>' + esc(fraca.nome) + '</b>, com ' + um(fraca.media) +
      ', e a mais forte é <b>' + esc(forte.nome) + '</b>, com ' + um(forte.media) + '. ' +
      'A distância entre as duas é de ' + um(forte.media - fraca.media) + ' ponto' + ((forte.media-fraca.media) >= 2 ? 's' : '') +
      ((forte.media - fraca.media) >= 1.5
        ? ', o que costuma indicar um grupo que evoluiu muito em uma frente e deixou outra para trás.'
        : ', o que indica um grupo relativamente parelho entre as frentes.') + '</p>');
  }
  h.push('<h2>A leitura desta sala</h2><p class="nota">Descreve o que a média mostra. É ponto de partida para a conversa, não veredito.</p>' +
    '<div class="leitura">' + p.join('') + '</div>');

  h.push('<details><summary>Ver os números em tabela</summary><table><thead><tr><th>Dimensão</th><th class="num">Média</th></tr></thead><tbody>' +
    dims.map(x => '<tr><td>' + esc(x.nome) + '</td><td class="num">' + um(x.media) + '</td></tr>').join('') + '</tbody></table></details>');

  h.push(atalhoPlanilha('central', 'aba Eventos', 'onde ficam os registros que montam este painel'));

  h.push('<div class="escopo">Este painel apresenta o resultado do grupo e não identifica nenhuma pessoa. ' +
    'Atualizado em ' + new Date(d.gerado_em).toLocaleString('pt-BR') + '.</div>');
  $('#conteudo').innerHTML = h.join('');
  agendar();
}

/* ======================= MONTAGEM ======================= */
/* Atalho para a base que alimenta o painel aberto. Fica fora do modo projetado,
   porque numa palestra ninguém precisa ver link de planilha na tela. */
function atalhoPlanilha(chave, aba, porque){
  if (PROJECAO) return '';
  const p = PLANILHAS.find(x => x.chave === chave);
  if (!p) return '';
  return '<p class="atalho-pl">Precisa dos dados por trás deste painel? ' +
    '<a href="' + planilhaUrl(chave) + '" target="_blank" rel="noopener">Abrir a planilha ' +
    esc(p.nome) + '</a>, na ' + esc(aba) + ', ' + esc(porque) + '.</p>';
}

/* ================== O VOCABULÁRIO DO TIME ==================
   Mostra as características que mais e que menos gente reconheceu em si. Vem
   pronto do Apps Script, já em contagem, então nenhuma marcação individual
   trafega até aqui. Turma pequena não recebe o bloco: com pouca gente, a lista
   de palavras deixa de ser retrato do grupo e vira retrato de pessoa. */
function vocabulario(pal, total){
  if (!pal) return '';

  if (pal.oculto) {
    return '<h2>O vocabulário do time</h2>' +
      '<p class="nota">Este bloco aparece a partir de ' + pal.minimo + ' respostas. ' +
      'Hoje esta turma tem ' + pal.respondentes + '. Com pouca gente, a lista de palavras deixaria de ' +
      'ser o retrato do grupo e passaria a apontar para uma pessoa.</p>';
  }

  const n = pal.respondentes;
  const lista = arr => '<ul class="palavras">' + arr.map(x =>
    '<li><span class="ponto" style="background:' + (PERFIS[x.g] ? PERFIS[x.g].cor : '#999') + '"></span>' +
    '<span class="txt">' + esc(x.t) + '</span>' +
    '<span class="qtd">' + x.n + ' de ' + n + '</span></li>').join('') + '</ul>';

  const topos = ORDEM.map(g => '<div class="topo-perfil" style="border-left:3px solid ' + PERFIS[g].cor + '">' +
    '<b style="color:' + PERFIS[g].cor + '">' + esc(PERFIS[g].animal) + '</b>' +
    '<ol>' + (pal.porPerfil[g] || []).map(x => '<li>' + esc(x.t) + '</li>').join('') + '</ol></div>').join('');

  return '<h2>O vocabulário do time</h2>' +
    '<p class="nota">Aqui não é o cálculo, são as palavras. Cada pessoa marcou, entre 200 características, ' +
    'as que reconheceu em si. Somando as marcações de todo mundo aparece o vocabulário do grupo: o que este time ' +
    'assume sobre si com facilidade e o que quase ninguém se vê fazendo. A bolinha diz de qual temperamento é cada palavra.</p>' +
    '<div class="vocab">' +
      '<div><h3>O que este time mais reconhece em si</h3>' +
      '<p class="cabecinho">As 15 características marcadas por mais gente. É o terreno confortável do grupo, ' +
      'o que já vem pronto e não precisa ser construído.</p>' + lista(pal.mais) + '</div>' +
      '<div><h3>O que quase ninguém se vê fazendo</h3>' +
      '<p class="cabecinho">As 15 menos marcadas. É onde costuma morar o ponto cego coletivo, e também o tipo de ' +
      'comportamento que este time vai precisar contratar, combinar ou desenvolver de propósito.' +
      (pal.nunca_marcadas > 15
        ? ' Aqui há um empate grande: ' + pal.nunca_marcadas + ' das 200 características não foram marcadas por ninguém, ' +
          'então esta lista é uma amostra equilibrada entre os quatro temperamentos, e não um ranking.'
        : '') + '</p>' +
      lista(pal.menos) + '</div>' +
    '</div>' +
    '<div class="topos">' + topos + '</div>' +
    '<p class="nota" style="margin-top:18px">Empate na contagem é resolvido por regra fixa, primeiro a ordem dos ' +
    'temperamentos e depois a ordem da característica na lista oficial, nunca por ordem alfabética. ' +
    'Lista de características na versão ' + esc(pal.versao || '') + '.</p>';
}

function montar(d){
  const r = document.getElementById('rotulo-topo');
  if (r) r.textContent = 'Painel de temperamentos do time';
  const linhas = d.linhas, total = d.total;
  const pred = distribuicao(linhas, 'pred');
  const sec = distribuicao(linhas, 'sec');
  const ord = ORDEM.slice().sort((a,b) => pred[b] - pred[a]);
  const lideres = linhas.filter(l => String(l.lidera || '').indexOf('Lidero') === 0).length;
  const setores = new Set(linhas.map(l => String(l.setor || '').trim()).filter(Boolean)).size;
  const empresa = (linhas.find(l => l.empresa) || {}).empresa || d.time;

  /* Quando o painel reúne mais de um código, o título deixa isso explícito e a
     lista das turmas somadas fica visível, para ninguém confundir o recorte. */
  const varias = (d.times || TIMES).length > 1;
  const reunidas = (d.times || TIMES);

  const h = [];
  h.push('<div class="capa"><p class="eyebrow">Metodologia MARES · Liderança Oxigênio</p>' +
    '<h1>Temperamentos ' + (varias ? 'reunidos<br>' + reunidas.length + ' turmas' : 'do time<br>' + esc(empresa)) + '</h1>' +
    '<p class="sub">Leitura coletiva a partir das respostas individuais ao Teste dos Temperamentos. ' +
    'O painel mostra o conjunto. Nenhum resultado individual é identificado aqui.' +
    (varias ? ' Este painel soma as turmas ' + reunidas.map(c => '<b>' + esc(c) + '</b>').join(', ') + '.' : '') +
    '</p></div>');

  h.push('<div class="tiles">' +
    '<div class="tile"><b>' + total + '</b><small>pessoas responderam</small></div>' +
    '<div class="tile"><b style="color:' + PERFIS[ord[0]].cor + '">' + PERFIS[ord[0]].animal + '</b><small>perfil mais presente</small></div>' +
    '<div class="tile"><b>' + lideres + '</b><small>pessoas que lideram equipe</small></div>' +
    '<div class="tile"><b>' + (setores || '—') + '</b><small>áreas representadas</small></div></div>');

  h.push('<h2>Como o time se distribui</h2>' +
    '<p class="nota">Cada pessoa tem um perfil predominante, que é o que aparece no piloto automático e sob pressão, ' +
    'e um secundário, que complementa. Abaixo, quantas pessoas do time estão em cada um.</p>');
  h.push('<h2 style="border-top:0;padding-top:0;font-size:1rem;margin-top:6px">Perfil predominante</h2>' + barras(pred, total));
  h.push('<h2 style="border-top:0;padding-top:0;font-size:1rem;margin-top:26px">Perfil secundário</h2>' + barras(sec, total));

  h.push('<h2>A leitura deste time</h2>' +
    '<p class="nota">O texto abaixo descreve o que a contagem mostra e o que costuma acontecer com uma composição assim. ' +
    'É ponto de partida para a conversa, não veredito.</p>' + leitura(linhas, pred, total));

  h.push(vocabulario(d.palavras, total));

  h.push('<h2>Combinações entre predominante e secundário</h2>' +
    '<p class="nota">A linha é o perfil predominante e a coluna é o secundário. Quanto mais escura a célula, ' +
    'mais pessoas naquela combinação.</p>' + matriz(linhas));

  /* Só faz sentido quando o painel reúne turmas: mostra como cada uma se compõe,
     lado a lado. É o motivo principal de reunir, comparar sem perder o todo. */
  if (varias) {
    const porTurma = cruzar(linhas, 'time', 'pred');
    if (porTurma.length > 1) {
      h.push('<h2>Cada turma dentro do conjunto</h2>' +
        '<p class="nota">A mesma leitura separando as turmas reunidas. Serve para ver se elas se parecem ou se ' +
        'uma delas puxa o conjunto para um lado. Diferença grande entre turmas da mesma empresa costuma dizer ' +
        'mais sobre quem foi contratado em cada momento do que sobre as pessoas.</p>' +
        legenda() + pilhas(porTurma) + tabelaCruzada(porTurma, 'Turma'));
    }
  }

  const porSetor = cruzar(linhas, 'setor', 'pred');
  if (porSetor.length > 1) {
    h.push('<h2>Composição por área</h2>' +
      '<p class="nota">Cada barra é uma área do time, e as faixas mostram a proporção de cada perfil dentro dela. ' +
      'Concentração de um só perfil numa área é o achado que mais costuma explicar atrito e gargalo.</p>' +
      legenda() + pilhas(porSetor) + tabelaCruzada(porSetor, 'Área'));
  }

  const porLideranca = cruzar(linhas, 'lidera', 'pred');
  if (porLideranca.length > 1) {
    h.push('<h2>Liderança e operação</h2>' +
      '<p class="nota">A mesma leitura separando quem conduz equipe de quem não conduz hoje.</p>' +
      legenda() + pilhas(porLideranca) + tabelaCruzada(porLideranca, 'Faixa'));
  }

  const porTempo = cruzar(linhas, 'tempo_casa', 'pred');
  if (porTempo.length > 1) {
    h.push('<h2>Tempo de casa</h2>' +
      '<p class="nota">Ajuda a ver se o perfil do time mudou com as contratações mais recentes.</p>' +
      legenda() + pilhas(porTempo) + tabelaCruzada(porTempo, 'Tempo de casa'));
  }

  const porGeracao = cruzar(linhas, 'geracao', 'pred');
  if (porGeracao.length > 1) {
    h.push('<h2>Gerações</h2>' + legenda() + pilhas(porGeracao) + tabelaCruzada(porGeracao, 'Geração'));
  }

  const aprende = contarPor(linhas.filter(l => l.como_aprende), 'como_aprende');
  if (aprende.length) {
    const mapa = new Map();
    linhas.forEach(l => String(l.como_aprende || '').split('|').map(s => s.trim()).filter(Boolean)
      .forEach(v => mapa.set(v, (mapa.get(v) || 0) + 1)));
    const lista = [...mapa.entries()].sort((a,b) => b[1] - a[1]);
    if (lista.length) {
      const maior = lista[0][1];
      h.push('<h2>Como este time aprende</h2>' +
        '<p class="nota">Cada pessoa podia marcar mais de uma forma. Serve para escolher o formato do próximo trabalho de desenvolvimento.</p>' +
        '<div class="barras">' + lista.map(([nome, n]) =>
          '<div class="linha"><div class="rot">' + esc(nome) + '</div>' +
          '<div class="trilho"><div class="fill" style="width:' + (n/maior*100) + '%;background:var(--azul)"></div></div>' +
          '<div class="val">' + n + '</div></div>').join('') + '</div>');
    }
  }

  h.push(atalhoPlanilha('central', 'aba Respostas', 'com o resultado individual de cada pessoa, que não aparece aqui'));

  h.push('<div class="escopo"><b>Sobre o escopo desta análise.</b> Este painel apresenta tendências comportamentais do grupo ' +
    'e não constitui diagnóstico psicológico. Temperamento indica tendência de comportamento e de preferência, e não determina ' +
    'caráter, competência, inteligência, saúde mental nem destino profissional. Esta leitura não deve ser usada para decisão de ' +
    'contratação, demissão, promoção ou exclusão. O resultado individual pertence a cada pessoa e foi enviado apenas para ela. ' +
    'Dados atualizados em ' + new Date(d.gerado_em).toLocaleString('pt-BR') + '.</div>');

  $('#conteudo').innerHTML = h.join('');
}

iniciar();
</script>
